
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>iMuse</title>

    <!-- Browser tab -->
    <link rel="icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32"
          href="./icons/favicon-32-v2.png">
    <link rel="icon" type="image/png" sizes="16x16"
          href="./icons/favicon-16.png">

    <!-- iPhone Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180"
          href="./icons/apple-touch-icon.png">

    <!-- Progressive Web App -->
    <link rel="manifest" href="./manifest.json">

    <meta name="apple-mobile-web-app-title" content="iMuse">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07145C">
</head>

<body>

<main>

    <h1>iMuse</h1>

    <p class="tagline">Turn your thoughts into text</p>
    <p class="subtitle">Speak freely. iMuse listens.</p>

    <div id="modelSelector">
        <label for="modelSelect">Whisper model:</label>

        <select id="modelSelect">
            <option value="tiny">Tiny — fastest</option>
            <option value="base" selected>Base — recommended</option>
            <option value="small">Small — high accuracy</option>
        </select>
    </div>

    <div id="languageSelector">
        <label for="languageSelect">Language:</label>

        <select id="languageSelect">
            <option value="en" selected>English</option>
            <option value="pt">Português (Portugal)</option>
        </select>
    </div>

    <button id="recordButton" disabled>
        Start Recording
    </button>

    <button id="transcribeButton" disabled>
        Transcribe
    </button>

    <div id="status">
        Loading Whisper base...
    </div>

    <h2>Transcript</h2>

    <div id="transcript"></div>

</main>

<script>
    const recordButton =
        document.getElementById("recordButton");

    const transcribeButton =
        document.getElementById("transcribeButton");

    const status =
        document.getElementById("status");

    const modelSelect =
        document.getElementById("modelSelect");

    const languageSelect =
        document.getElementById("languageSelect");

    let mediaRecorder;
    let audioChunks = [];

    function playReadyChime() {

        const audioContext =
            new AudioContext();

        const now =
            audioContext.currentTime;

        const oscillator1 =
            audioContext.createOscillator();

        const oscillator2 =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator1.frequency.value = 659.25;
        oscillator2.frequency.value = 783.99;

        oscillator1.type = "sine";
        oscillator2.type = "sine";

        oscillator1.connect(gain);
        oscillator2.connect(gain);

        gain.connect(audioContext.destination);

        gain.gain.setValueAtTime(0, now);

        gain.gain.linearRampToValueAtTime(
            0.08,
            now + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.35
        );

        oscillator1.start(now);
        oscillator2.start(now + 0.12);

        oscillator1.stop(now + 0.35);
        oscillator2.stop(now + 0.47);
    }

    recordButton.addEventListener(
        "click",
        async () => {

            if (
                !mediaRecorder ||
                mediaRecorder.state === "inactive"
            ) {

                try {

                    status.textContent =
                        "Preparing microphone...";

                    const stream =
                        await navigator.mediaDevices.getUserMedia({
                            audio: true
                        });

                    mediaRecorder =
                        new MediaRecorder(stream);

                    audioChunks = [];

                    let readySignalPlayed = false;

                    mediaRecorder.addEventListener(
                        "dataavailable",
                        event => {

                            audioChunks.push(
                                event.data
                            );

                            if (!readySignalPlayed) {

                                readySignalPlayed = true;

                                playReadyChime();

                                status.textContent =
                                    "Ready — speak now.";
                            }
                        }
                    );

                    mediaRecorder.addEventListener(
                        "stop",
                        () => {

                            stream
                                .getTracks()
                                .forEach(track =>
                                    track.stop()
                                );

                            const audioBlob =
                                new Blob(
                                    audioChunks,
                                    {
                                        type: "audio/webm"
                                    }
                                );

                            console.log(
                                "Recording complete:",
                                audioBlob
                            );

                            status.textContent =
                                "Recording complete.";

                            window.lastRecording =
                                audioBlob;

                            transcribeButton.disabled =
                                false;
                        }
                    );

                    mediaRecorder.start(100);

                    recordButton.textContent =
                        "Stop Recording";

                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Microphone access was denied or unavailable.";
                }

            } else {

                mediaRecorder.stop();

                recordButton.textContent =
                    "Start Recording";
            }
        }
    );

    transcribeButton.addEventListener(
        "click",
        () => {

            window.transcribeRecording();
        }
    );

    modelSelect.addEventListener(
        "change",
        () => {

            recordButton.disabled =
                true;

            transcribeButton.disabled =
                true;

            window.lastRecording =
                null;

            document.getElementById(
                "transcript"
            ).textContent = "";

            window.loadWhisperModel(
                modelSelect.value
            );
        }
    );

</script>

<script
    type="module"
    src="js/whisper.js">
</script>

</body>
</html>
