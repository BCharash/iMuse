<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>iMuse</title>

    <!-- Browser tab -->
    <link rel="icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32"
          href="./icons/favicon-32-v2.png">
    <link rel="icon" type="image/png" sizes="16x16"
          href="./icons/favicon-16.png">

    <!-- iPhone Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180"
          href="./icons/apple-touch-icon.png">

    <!-- Progressive Web App -->
    <link rel="manifest" href="./manifest.json">

    <meta name="apple-mobile-web-app-title" content="iMuse">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07145C">
</head>

<body>

<main>

    <h1>iMuse</h1>

    <p class="tagline">Turn your thoughts into text</p>
    <p class="subtitle">Speak freely. iMuse is ready</p>

    <button id="recordButton">
        Start Recording    </button>

    <audio
        id="audioPlayer"
        controls
        hidden>
    </audio>

    <div id="recordingControls" hidden>

        <button id="recordAgainButton">
            Record Again
        </button>

        <button id="deleteButton">
            Delete
        </button>

    </div>

    <div id="modelSelector">
        <label for="modelSelect">Whisper model:</label>

        <select id="modelSelect">
            <option value="tiny">Tiny — fastest</option>
            <option value="base" selected>Base — recommended</option>
            <option value="small">Small — high accuracy</option>
        </select>
    </div>

    <div id="languageSelector">
        <label for="languageSelect">Language:</label>

        <select id="languageSelect">
            <option value="en" selected>English</option>
            <option value="pt">Português (Portugal)</option>
        </select>
    </div>

    <button id="transcribeButton" disabled>
        Transcribe
    </button>

    <div id="status">
        Ready to record.
    </div>

    <h2>Transcript</h2>

    <div id="transcript"></div>

</main>

<script
    type="module"
    src="js/app.js">
</script>

<script
    type="module"
    src="js/recorder.js">
</script>

<script
    type="module"
    src="js/whisper.js">
</script>

</body>
</html>
