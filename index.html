<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>iMuse</title>

    <!-- Browser tab -->
    <link rel="icon" type="image/png" sizes="32x32"
          href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16"
          href="icons/favicon-16.png">

    <!-- iPhone Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180"
          href="icons/apple-touch-icon.png">

    <!-- Progressive Web App -->
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-title" content="iMuse">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07145C">
</head>
<body>

<main>

<h1>iMuse</h1>
<p>Transcribe your musings with Whisper</p>

<button id="recordButton">Start Recording</button> <button id="transcribeButton">Transcribe</button>

<div id="status"></div>

<h2>Transcript</h2>
<div id="transcript"></div>
</main>

<script>
    const recordButton = document.getElementById("recordButton");
    const transcribeButton = document.getElementById("transcribeButton");
    const status = document.getElementById("status");

    let mediaRecorder;
    let audioChunks = [];

    recordButton.addEventListener("click", async () => {

        if (!mediaRecorder || mediaRecorder.state === "inactive") {

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener("stop", () => {
                    stream.getTracks().forEach(track => track.stop());

                    const audioBlob = new Blob(audioChunks, {
                        type: "audio/webm"
                    });

                    console.log("Recording complete:", audioBlob);

                    status.textContent = "Recording complete.";
                    window.lastRecording = audioBlob;
                });

                mediaRecorder.start();

                recordButton.textContent = "Stop Recording";
                status.textContent = "Recording...";

            } catch (error) {
                console.error(error);
                status.textContent =
                    "Microphone access was denied or unavailable.";
            }

        } else {

            mediaRecorder.stop();
            recordButton.textContent = "Start Recording";
        }
    });

    transcribeButton.addEventListener("click", () => {
        window.transcribeRecording();
    });
</script>

<script type="module" src="js/whisper.js"></script>

</body>
</html>
