<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iMuse · Audio Transition Lab</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light}*{box-sizing:border-box}body{background:#f4f6fa;color:#17243a;margin:0}main{max-width:650px;margin:auto;padding:12px}h1{font-size:1.25rem;margin:0 0 8px}.panel{background:white;border:1px solid #d9dfeb;border-radius:12px;padding:12px;margin:9px 0}button{background:#2053ba;color:white;border:0;border-radius:8px;padding:12px;font-weight:650;font-size:1rem}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap}#state{font-size:1.1rem;font-weight:700}#mic{font-size:.84rem;overflow-wrap:anywhere}audio{width:100%}.clip{border-top:1px solid #ddd;padding-top:9px;margin-top:9px}.clip b{display:block;margin-bottom:4px}p{margin:8px 0}details{margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;font-size:.72rem}small{color:#526179}#stages{margin-top:8px}a{font-size:.86rem}@media(prefers-color-scheme:dark){body{background:#101725;color:#e7eefb}.panel{background:#1b293d;border-color:#34475f}small{color:#aabbd0}}</style></head><body><main>
<h1>iMuse · Active Inference Audio Test</h1>
<div class="panel"><div class="actions"><button id="run">Start experiment</button><button id="stop" disabled>Stop</button><button id="export" disabled>Export audio + diagnostics</button></div><p id="state">Ready</p><small>Automatic: A microphone only · B say “Hey Friday” · C say “Go” and “Stop”.</small><p id="mic">Microphone: not acquired</p></div>
<div class="panel"><b>Recordings</b><div id="stages"><small>Recordings appear here automatically.</small></div></div>
<details class="panel"><summary>Technical diagnostics</summary><pre id="log"></pre></details>
</main><script type="module">
import {loadVoicuteWakeWord} from './wake-word.js';
const $=id=>document.getElementById(id), events=[],clips=[];let masterBlocks=[],masterN=0,running=false,abort=false,stream=null,ctx=null,source=null,proc=null,mute=null,wake=null,tfRecognizer=null,tfActive=false,originalGUM=null,sharedCount=0,stage=null,pcmRate=48000,voiceScores=[],tfScores=[],wakePhase=false,wakeBusy=false,wakeRing=null,wakePos=0,wakeFilled=0,wakeLastAt=0,wakeInferences=0,wakeTriggers=0,tfInferences=0,phaseMarks=[];
const stamp=()=>new Date().toISOString();function log(message,data={}){events.push({at:stamp(),message,...data});$('log').textContent+=message+'\n';}function status(s){$('state').textContent=s;log(s)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function check(){if(abort)throw Error('Experiment stopped')}
function wav(blocks,n,rate){const b=new ArrayBuffer(44+n*2),v=new DataView(b);const str=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);let k=44;for(const a of blocks)for(let i=0;i<a.length;i++){const x=Math.max(-1,Math.min(1,a[i]));v.setInt16(k,x<0?x*32768:x*32767,true);k+=2;}return new Blob([b],{type:'audio/wav'})}
function begin(label){stage={label,blocks:[],n:0,started:stamp(),startedMs:performance.now()};phaseMarks.push({stage:label,at:stamp(),sampleOffset:masterN,action:'begin'});log('Recording started: '+label)}function end(){if(!stage)return;const s=stage;stage=null;phaseMarks.push({stage:s.label,at:stamp(),sampleOffset:masterN,action:'end'});if(s.n<pcmRate/3){log('WARNING: insufficient audio for '+s.label,{samples:s.n});return}const blob=wav(s.blocks,s.n,pcmRate),url=URL.createObjectURL(blob),name=s.label+'.wav';clips.push({name,blob,started:s.started,seconds:s.n/pcmRate});const wrap=document.createElement('div');wrap.className='clip';const title=document.createElement('b');title.textContent=s.label+' · '+(s.n/pcmRate).toFixed(1)+' seconds';const player=document.createElement('audio');player.controls=true;player.src=url;const link=document.createElement('a');link.href=url;link.download=name;link.textContent='Save WAV';wrap.append(title,player,link);if(clips.length===1)$('stages').textContent='';$('stages').append(wrap);$('export').disabled=false;log('Recording saved: '+name,{samples:s.n,bytes:blob.size})}
function playTone(){return new Promise(async resolve=>{try{const c=new (window.AudioContext||window.webkitAudioContext)();await c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.09;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.5);o.onended=async()=>{await c.close();resolve()}}catch(e){log('Reference tone unavailable: '+e.message);resolve()}})}
async function acquire(){stream=await navigator.mediaDevices.getUserMedia({audio:true});const track=stream.getAudioTracks()[0],settings=track.getSettings();$('mic').textContent='Acquired input: '+(track.label||'Identity not exposed')+' · '+(settings.sampleRate||'?')+' Hz · '+(settings.channelCount||'?')+' channel(s)';log('Microphone acquired',{label:track.label,settings});track.onmute=()=>log('Microphone track muted');track.onunmute=()=>log('Microphone track unmuted');track.onended=()=>log('Microphone track ended');ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();pcmRate=ctx.sampleRate;source=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(2048,1,1);mute=ctx.createGain();mute.gain.value=0;source.connect(proc);proc.connect(mute);mute.connect(ctx.destination);proc.onaudioprocess=e=>{if(!running)return;const a=e.inputBuffer.getChannelData(0);const copy=new Float32Array(a);masterBlocks.push(copy);masterN+=copy.length;if(stage){stage.blocks.push(copy);stage.n+=a.length}if(wakePhase&&wakeRing){for(let i=0;i<a.length;i++){wakeRing[wakePos]=a[i]*32767;wakePos=(wakePos+1)%wakeRing.length;}wakeFilled=Math.min(wakeRing.length,wakeFilled+a.length);if(performance.now()-wakeLastAt>=180){wakeLastAt=performance.now();void inferWake();}}}}
function resample16(raw,rate){if(rate===16000)return raw;const n=Math.floor(raw.length*16000/rate),out=new Float32Array(n),ratio=rate/16000;for(let i=0;i<n;i++){const pos=i*ratio,k=Math.floor(pos),j=Math.min(k+1,raw.length-1);out[i]=raw[k]*(1-(pos-k))+raw[j]*(pos-k)}return out;}
async function inferWake(){if(wakeBusy||!wakePhase||!wakeRing||!wake)return;const needed=Math.ceil(wake.engine.audioSamplesNeeded()*pcmRate/16000);if(needed>wakeRing.length||wakeFilled<needed)return;wakeBusy=true;try{const raw=new Float32Array(needed),offset=(wakePos-needed+wakeRing.length)%wakeRing.length;for(let i=0;i<needed;i++)raw[i]=wakeRing[(offset+i)%wakeRing.length];const r=await wake.engine.predict(resample16(raw,pcmRate));wakeInferences++;const detected=wake.engine.detect(r.word,r.prob,r.consFrames,.90,1500,Date.now(),r.sigmoid);if(detected)wakeTriggers++;voiceScores.push({at:stamp(),score:r.prob,word:r.word,consFrames:r.consFrames,detected:detected||null});if(voiceScores.length>500)voiceScores.shift();if(wakeInferences%8===0||detected)log('Voicute '+(detected?'DETECTED':'score')+': '+Number(r.prob).toFixed(3),{type:'wakeInference',score:r.prob,detected:detected||null});}catch(e){log('Voicute inference error: '+e.message)}finally{wakeBusy=false}}
function startWakeInference(){wakeRing=new Float32Array(pcmRate*3);wakePos=0;wakeFilled=0;wakeLastAt=0;wakeInferences=0;wakeTriggers=0;wakePhase=true;log('Voicute inference ACTIVE')}
function stopWakeInference(){wakePhase=false;wakeRing=null;log('Voicute inference stopped',{inferences:wakeInferences,triggers:wakeTriggers})}
async function loadJS(url,global){if(window[global])return;await new Promise((ok,fail)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>fail(Error('Cannot load '+url));document.head.append(s)});if(!window[global])throw Error(global+' unavailable')}
async function initWake(){wake=await loadVoicuteWakeWord({threshold:.90,onStatus:x=>log('Voicute: '+x)});log('Voicute model ready',{phrase:wake.phrase,loadedFriday:wake.loadedFriday});if(!wake.loadedFriday)log('WARNING: Hey Friday model not confirmed')}
function installClone(){const media=navigator.mediaDevices;originalGUM=media.getUserMedia;media.getUserMedia=function(constraints){if(!constraints?.audio)return originalGUM.call(media,constraints);const t=stream?.getAudioTracks()[0];if(!t||t.readyState!=='live')return Promise.reject(Error('Original track unavailable'));sharedCount++;log('TensorFlow microphone request served by cloned original track',{sharedCount});return Promise.resolve(new MediaStream([t.clone()]));}}
function restoreClone(){if(originalGUM){navigator.mediaDevices.getUserMedia=originalGUM;originalGUM=null}}
async function initTF(){await loadJS('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js','tf');await loadJS('https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.5.4/dist/speech-commands.min.js','speechCommands');tfRecognizer=speechCommands.create('BROWSER_FFT');await tfRecognizer.ensureModelLoaded();const labels=tfRecognizer.wordLabels();installClone();try{await tfRecognizer.listen(r=>{const arr=Array.from(r.scores);const items=labels.map((name,i)=>({name,score:arr[i]})).sort((a,b)=>b.score-a.score);tfInferences++;tfScores.push({at:stamp(),top:items[0],go:arr[labels.indexOf('go')],stop:arr[labels.indexOf('stop')]});if(tfInferences%5===0)log('TensorFlow: '+items[0].name+' '+items[0].score.toFixed(3),{type:'tfInference'});},{probabilityThreshold:0,overlapFactor:.5,invokeCallbackOnNoiseAndUnknown:true});tfActive=true;log('TensorFlow listening, shared track',{sharedCount})}finally{restoreClone()}}
async function recordFor(label,ms=6000){check();begin(label);status('Speak now — '+label);await sleep(ms);end();check()}
async function cleanup(){end();if(masterN>pcmRate/3){const blob=wav(masterBlocks,masterN,pcmRate),url=URL.createObjectURL(blob);clips.push({name:'FULL-continuous-from-microphone-open.wav',blob,started:events.find(x=>x.message==='Microphone acquired')?.at||stamp(),seconds:masterN/pcmRate});const wrap=document.createElement('div');wrap.className='clip';const title=document.createElement('b');title.textContent='FULL — continuous microphone capture · '+(masterN/pcmRate).toFixed(1)+' seconds';const player=document.createElement('audio');player.controls=true;player.src=url;wrap.append(title,player);$('stages').append(wrap);$('export').disabled=false;}masterBlocks=[];masterN=0;stopWakeInference();try{if(tfActive)await tfRecognizer.stopListening()}catch(e){log('TF stop: '+e.message)}tfActive=false;restoreClone();if(proc)proc.onaudioprocess=null;try{proc?.disconnect();source?.disconnect();mute?.disconnect()}catch(e){}try{await ctx?.close()}catch(e){}stream?.getTracks().forEach(t=>t.stop());proc=source=mute=ctx=stream=null;running=false;$('run').disabled=false;$('stop').disabled=true;}
$('stop').onclick=()=>{abort=true;status('Stopping…')};$('run').onclick=async()=>{if(running)return;running=true;abort=false;masterBlocks=[];masterN=0;voiceScores=[];tfScores=[];tfInferences=0;phaseMarks=[];sharedCount=0;$('stages').textContent='';clips.length=0;$('export').disabled=true;$('run').disabled=true;$('stop').disabled=false;try{
 status('0 — Reference sound BEFORE microphone access');await playTone();check();
 status('Opening microphone…');await acquire();check();status('Microphone acquired. Listen for any change in Shokz sound.');await playTone();
 await recordFor('A-microphone-only');
 status('Loading Voicute. Keep microphone open…');await initWake();check();
 startWakeInference();await recordFor('B-Voicute-inferencing');stopWakeInference();check();
 status('Opening TensorFlow pipeline. Keep microphone open…');await initTF();check();
 await recordFor('C-TensorFlow-inferencing');
 status('Finished — listen to A, B, C and export.');
 }catch(e){status('Experiment ended: '+e.message);log('ERROR '+(e.stack||e.message))}finally{await cleanup()}};
$('export').onclick=async()=>{if(!clips.length)return;const b=$('export');b.disabled=true;try{await loadJS('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','JSZip');const z=new JSZip();for(const c of clips)z.file(c.name,c.blob);z.file('diagnostics.json',JSON.stringify({exportedAt:stamp(),userAgent:navigator.userAgent,clips:clips.map(({name,started,seconds,blob})=>({name,started,seconds,bytes:blob.size})),sharedCount,tfScores,tfInferences,voiceScores,wakeInferences,wakeTriggers,phaseMarks,events},null,2));const blob=await z.generateAsync({type:'blob',compression:'STORE'});const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='iMuse-audio-transition-test.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),20000)}catch(e){status('Export error: '+e.message)}finally{b.disabled=false}};
</script></body></html>
